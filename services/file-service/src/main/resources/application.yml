server:
  port: 8084

spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:4348

minio:
  # 端口与 docker-compose.yml 的 minio 服务映射保持一致（宿主 9100 → 容器 9000）。
  endpoint: http://localhost:9100
  access-key: minioadmin
  secret-key: minioadmin123
  bucket: resume-files
