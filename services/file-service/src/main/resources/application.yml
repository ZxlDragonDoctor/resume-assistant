server:
  port: 8084

spring:
  application:
    name: file-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    nacos:
      discovery:
        server-addr: localhost:4348

minio:
  # 端口与 docker-compose.yml 的 minio 服务映射保持一致（宿主 9010 → 容器 9000）。
  endpoint: http://localhost:9010
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  bucket: resume-files
  # 浏览器可访问的 MinIO 外网地址（容器部署时用环境变量 MINIO_PUBLIC_ENDPOINT 覆盖）
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9010}
