server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
        - id: resume-service-public
          uri: lb://resume-service
          predicates:
            - Path=/api/public/**
        - id: resume-service
          uri: lb://resume-service
          predicates:
            - Path=/api/resumes/**
        - id: template-service
          uri: lb://template-service
          predicates:
            - Path=/api/templates/**
        - id: file-service
          uri: lb://file-service
          predicates:
            - Path=/api/files/**
        - id: ai-service
          # 本机开发默认 localhost:8086；容器部署时由环境变量 AI_SERVICE_URL 覆盖为 http://ai-service:8086
          uri: ${AI_SERVICE_URL:http://localhost:8086}
          predicates:
            - Path=/api/ai/**
        - id: export-service
          # 同上，容器内用 EXPORT_SERVICE_URL=http://export-service:8085
          uri: ${EXPORT_SERVICE_URL:http://localhost:8085}
          predicates:
            - Path=/api/export/**
          filters:
            - SetPath=/export
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            # 本机默认放行 Vite dev server；部署时用 CORS_ALLOWED_ORIGINS 覆盖
            allowedOrigins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

    nacos:
      discovery:
        server-addr: localhost:4348

