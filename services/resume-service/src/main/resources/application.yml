server:
  port: 8082

spring:
  application:
    name: resume-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_assistant}
    username: ${DB_USERNAME:resume}
    password: ${DB_PASSWORD:resume123}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:4348

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  type-handlers-package: com.zxl.resume.resume.config
  global-config:
    db-config:
      id-type: INPUT
