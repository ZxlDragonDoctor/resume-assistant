server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_assistant}
    username: ${DB_USERNAME:resume}
    password: ${DB_PASSWORD:resume123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  cloud:
    nacos:
      discovery:
        server-addr: localhost:4348

jwt:
  # 与 gateway 的 JWT_SECRET 必须一致；生产禁止使用默认值
  secret: ${JWT_SECRET:local-dev-jwt-secret-change-me-before-deploy-0123456789}
  expiration: 86400000
