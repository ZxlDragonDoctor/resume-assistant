server:
  port: 8083

spring:
  application:
    name: template-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/resume_assistant}
    username: ${DB_USERNAME:resume}
    password: ${DB_PASSWORD:resume123}
  cloud:
    nacos:
      discovery:
        server-addr: localhost:4348

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.zxl.resume.common.mybatis
  global-config:
    db-config:
      id-type: ASSIGN_UUID
