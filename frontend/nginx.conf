# ============================================================================
# nginx 配置：托管前端静态文件 + 反向代理后端服务
# ----------------------------------------------------------------------------
# 设计要点：让前端与后端**同源**。
#   浏览器只访问 http://<host>/...，由 nginx 在服务端转发到各后端容器。
#   好处：① 彻底免 CORS 配置；② 前端构建时 VITE_API_BASE_URL 可留空（相对路径）。
#
# 路由约定（与前端 src/services/api.ts、vite.config.ts 的 dev 代理保持一致）：
#   /api/ai/**      → 直连 ai-service（不经网关，因为网关内部也用 localhost:8086）
#   /api/**         → 网关 gateway，由网关再分发到 auth/resume/template/file
#   /export/**      → 直连 export-service（该服务路由无 /api 前缀）
# ============================================================================

upstream gateway_upstream  { server gateway:8080; }
upstream ai_upstream       { server ai-service:8086; }
upstream export_upstream   { server export-service:8085; }

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 导出 PDF 可能较大，放宽上传/响应体限制
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ---------- 静态资源 ----------
    # Vite 产物带内容哈希，可长期强缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---------- AI 服务（先于 /api/ 匹配，避免被网关规则吃掉） ----------
    location /api/ai/ {
        proxy_pass http://ai_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 调用较慢，放宽超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---------- 导出服务 ----------
    location /export/ {
        proxy_pass http://export_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 无头 Chrome 渲染 + 打印 PDF，给足时间
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_buffering off;
    }

    # ---------- 网关（auth / resumes / templates / files） ----------
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---------- SPA history fallback ----------
    # 必须放在最后：任何未命中的路径回退到 index.html，
    # 否则 /editor/:id、/share/:token 直接刷新会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
