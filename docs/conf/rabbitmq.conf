# ============================================================================
# rabbitmq.conf —— 低内存服务器专用
# ----------------------------------------------------------------------------
# 为什么用文件而不是环境变量：
#   RABBITMQ_VM_MEMORY_HIGH_WATERMARK 在 RabbitMQ 3.13 已**废弃**，
#   设置后会直接启动失败（error: deprecated environment variables detected）。
#   内存水位这类参数必须走配置文件。
#
# 用法（docker-compose.server.yml 中已挂载到 /etc/rabbitmq/rabbitmq.conf）
# ============================================================================

# 内存水位：默认 0.4 会按宿主总内存算（1.6GB => 640MB 才触发流控），
# 这里显式压到 0.15，约 240MB 就进入流控，避免容器把宿主吃光。
vm_memory_high_watermark.relative = 0.15

# 磁盘水位：留出足够余量，磁盘打满会让节点停止接受消息
disk_free_limit.absolute = 1GB

# 单机小内存场景，减少内存占用
vm_memory_high_watermark_paging_ratio = 0.5
