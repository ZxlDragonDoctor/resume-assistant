[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# SPA 路由回退：/editor/xxx、/share/xxx 等前端路由直接访问时交给 index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
