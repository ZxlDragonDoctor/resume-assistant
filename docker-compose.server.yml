# ============================================================================
# docker-compose.server.yml —— 低内存服务器（1.6GB）部署覆盖层
# ----------------------------------------------------------------------------
# 用法（必须在仓库根目录执行）：
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# 这个文件主要做两件事：
#   1. 把每个容器的内存压到「能跑起来」的最小值（mem_limit 是硬上限，
#      超过会被内核 OOM Kill，所以必须实测调参，不能拍脑袋写小）。
#   2. 保留运行所需中间件，并关闭不必要的宿主端口映射。
#
# 为什么需要它：本机 1608MB RAM + 2047MB swap。全栈 13 个容器的默认堆
# 加起来会超过物理内存，只能靠 mem_limit + swap 撑住。实测踩过的坑见下方注释。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 基础设施
  # --------------------------------------------------------------------------
  postgres:
    mem_limit: 220m
    # shared_buffers 默认 128MB 对这个尺寸的机器偏大，调小并限制连接数
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=40
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB

  redis:
    mem_limit: 64m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "24mb", "--maxmemory-policy", "allkeys-lru"]

  nacos:
    mem_limit: 400m
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # 【关键】官方镜像的 docker-startup.sh 读的是 JVM_XMS/JVM_XMX/JVM_XMN/JVM_MS/JVM_MMS，
      # **不是** JAVA_OPTIONS —— 用错变量名会被静默忽略，Nacos 会沿用默认的
      # -Xms1g -Xmx1g，在 400MB 容器里疯狂 GC 卡死（实测踩过这个坑）。
      JVM_XMS: "128m"
      JVM_XMX: "256m"
      JVM_XMN: "64m"
      JVM_MS: "64m"
      JVM_MMS: "128m"

  minio:
    mem_limit: 160m

  # --------------------------------------------------------------------------
  # 关于 RabbitMQ：export-service 使用它消费异步导出队列；HTTP 直出仍可独立工作。
  # 因此保留服务但限制内存、关闭宿主端口映射，避免占用额外端口。
  #
  # 但**不能**用 `profiles: ["disabled"]` 来「关掉」它：
  # profiles 会让该 service 在 compose 模型里彻底不存在，
  # 于是 export-service 的 `depends_on: rabbitmq` 会直接报
  #   service "export-service" depends on undefined service "rabbitmq"
  # 整个 compose 项目连解析都过不了（启动和 build 都会失败）。
  #
  # 正确做法：保留服务定义（让 depends_on 有效），限制其内存，且不映射宿主端口。
  # --------------------------------------------------------------------------
  rabbitmq:
    mem_limit: 90m
    ports: !override []
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-resume}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-resume123}
      # 【不要设 RABBITMQ_VM_MEMORY_HIGH_WATERMARK】
      # 3.13 已废弃该环境变量，设了会直接启动失败退出：
      #   error: RABBITMQ_VM_MEMORY_HIGH_WATERMARK is set but deprecated
      # 想调内存水位只能写 rabbitmq.conf（配置项 vm_memory_high_watermark）。
      # 本机内存小，用配置文件方式；这里通过 mounted conf 生效。
    volumes:
      - ./docs/conf/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

  # --------------------------------------------------------------------------
  # 应用层：统一用「小堆 + SerialGC」
  #   SerialGC 在小堆（< 256MB）下比 G1 更省内存、启动更快，也少一个 GC 线程。
  # --------------------------------------------------------------------------
  gateway:
    mem_limit: 200m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  auth-service:
    mem_limit: 200m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  resume-service:
    mem_limit: 220m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  template-service:
    mem_limit: 190m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms48m -Xmx112m -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  file-service:
    mem_limit: 190m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms48m -Xmx112m -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  export-service:
    mem_limit: 340m
    # Chromium 需要较大 /dev/shm，否则会随机崩溃（默认 64MB 不够）
    shm_size: "256m"
    build:
      args:
        # 实测 dl-cdn.alpinelinux.org 从本机**完全超时**，apk 会无限挂起
        ALPINE_MIRROR: mirrors.tuna.tsinghua.edu.cn

  ai-service:
    mem_limit: 180m
    build:
      args:
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
        APT_MIRROR: mirrors.tuna.tsinghua.edu.cn

  frontend:
    mem_limit: 48m
    build:
      args:
        NPM_REGISTRY: https://registry.npmmirror.com
        ALPINE_MIRROR: mirrors.tuna.tsinghua.edu.cn
