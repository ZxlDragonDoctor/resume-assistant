# ============================================================================
# docker-compose.server.yml —— 低内存服务器（1.6GB）部署覆盖层
# ----------------------------------------------------------------------------
# 用法（必须在仓库根目录执行）：
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# 这个文件只做两件事：
#   1. 把每个容器的内存压到「能跑起来」的最小值（mem_limit 是硬上限，
#      超过会被内核 OOM Kill，所以必须实测调参，不能拍脑袋写小）。
#   2. 关掉本项目当前用不到的重组件（RabbitMQ），给 JVM 腾内存。
#
# 为什么需要它：本机 1608MB RAM + 2047MB swap。全栈 13 个容器的默认堆
# 加起来会超过物理内存，只能靠 mem_limit + swap 撑住。实测踩过的坑见下方注释。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # 基础设施
  # --------------------------------------------------------------------------
  postgres:
    mem_limit: 220m
    # shared_buffers 默认 128MB 对这个尺寸的机器偏大，调小并限制连接数
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=40
      - -c
      - effective_cache_size=128MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=16MB

  redis:
    mem_limit: 64m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "24mb", "--maxmemory-policy", "allkeys-lru"]

  nacos:
    mem_limit: 400m
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      # 【关键】官方镜像的 docker-startup.sh 读的是 JVM_XMS/JVM_XMX/JVM_XMN/JVM_MS/JVM_MMS，
      # **不是** JAVA_OPTIONS —— 用错变量名会被静默忽略，Nacos 会沿用默认的
      # -Xms1g -Xmx1g，在 400MB 容器里疯狂 GC 卡死（实测踩过这个坑）。
      JVM_XMS: "128m"
      JVM_XMX: "256m"
      JVM_XMN: "64m"
      JVM_MS: "64m"
      JVM_MMS: "128m"

  minio:
    mem_limit: 160m

  # 当前业务代码未使用 RabbitMQ（导出/AI 走 HTTP 同步调用），
  # 这里直接禁用，省下约 200MB —— 这对 1.6GB 的机器是决定性的。
  rabbitmq:
    profiles: ["disabled"]

  # --------------------------------------------------------------------------
  # 应用层：统一用「小堆 + SerialGC」
  #   SerialGC 在小堆（< 256MB）下比 G1 更省内存、启动更快，也少一个 GC 线程。
  # --------------------------------------------------------------------------
  gateway:
    mem_limit: 200m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  auth-service:
    mem_limit: 200m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  resume-service:
    mem_limit: 220m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms64m -Xmx128m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  template-service:
    mem_limit: 190m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms48m -Xmx112m -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  file-service:
    mem_limit: 190m
    build:
      args:
        MAVEN_IMAGE: maven:3.9-eclipse-temurin-17
        JRE_IMAGE: eclipse-temurin:17-jre
        JRE_FLAVOR: debian
    environment:
      JAVA_OPTS: "-Xms48m -Xmx112m -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC -Duser.timezone=Asia/Shanghai"

  export-service:
    mem_limit: 340m
    # Chromium 需要较大 /dev/shm，否则会随机崩溃（默认 64MB 不够）
    shm_size: "256m"

  ai-service:
    mem_limit: 180m

  frontend:
    mem_limit: 48m
